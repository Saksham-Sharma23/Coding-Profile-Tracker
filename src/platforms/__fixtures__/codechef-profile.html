<!doctype html>
<!--
  Trimmed capture of https://www.codechef.com/users/gennady.korotkevich — a public
  reference account, never the maintainer's own profile.

  Kept deliberately structural rather than minimal. The previous fixture was a 1.3 KB
  snippet of only the elements the parser already read, so it could not have caught the
  two things that were actually wrong with the parser: that page-existence was inferred
  from the rating, and that CodeChef now emits TWO rating blocks. Both are represented
  below, with the DSA block's unrelated numbers left in place so the scoping is tested
  rather than assumed.
-->

                </span>
              </li>
              <li><label>Country:</label><span><span class="user-country-name">Belarus</span></span></li>
